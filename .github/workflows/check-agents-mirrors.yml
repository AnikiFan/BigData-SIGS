name: Check AGENTS.md mirrors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Full-text mirrors match AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compare AGENTS.md mirrors
        run: python3 scripts/check_agents_mirrors.py
